targets:
  # Low-complexity static page
  - name: example_org
    url: https://example.org
    expected_fields:
      title: "Example Domain"
    selectors:
      title:
        css: "h1"
    source_updated_at: "2024-01-01T00:00:00Z"
    complexity: low

  # Medium: delayed response simulating dynamic content
  - name: httpbin_delay
    url: https://httpbin.org/delay/2
    expected_fields:
      title: "httpbin.org"
    selectors:
      title:
        css: "title"
    source_updated_at: "2024-01-01T00:00:00Z"
    complexity: medium

  # another example target
  - name: bbc
    url: https://www.bbc.com/news/articles/c87y4ljx85qo
    expected_fields:
      title: "bbsc"
    selectors:
      title:
        css: "title"
    source_updated_at: "2024-01-01T00:00:00Z"
    complexity: high

sampling:
  repeats: 1
  parallelism: 3

# Pseudo ground truth configuration
pseudo_ground_truth:
  enabled: true
  confidence_threshold: 0.6  # Minimum confidence to accept consensus
  min_consensus: 2           # Minimum scrapers that must agree
  cache_enabled: true
  cache_max_age_hours: 24

time_budget:
  requests:
    timeout_seconds: 10
  scrapy:
    timeout_seconds: 10
  selenium:
    timeout_seconds: 20
  puppeteer:
    timeout_seconds: 20
  playwright:
    timeout_seconds: 20

parsing:
  text_normalization:
    strip: true
    lower: false
